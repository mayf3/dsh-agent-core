# User patch layer of the agent-core-memory profile, applied after every
# bundle layer. Overrides only what the memory acceptance needs.
#
# 1. Session persistence stays under the agent home ($DSH_HOME/sessions), with
#    plain JSONL instead of zstd frames so the verification driver can inspect
#    session content deterministically (same override as agent-core-demo).
# 2. The persona override replaces the process-model benchmark persona from
#    bundle-demo ("do not call any tools") — the memory agent must be able to
#    call the memory_* tools.
- id: session-persistence-jsonl
  config:
    root: !!js "process.env.DSH_DEMO_SESSION_ROOT ?? dshHomePath('sessions')"
    compression: none

# @agent-core/bundle-memory 行由 bundle 层插入；此处只覆盖部署相关配置。
# workspaceRoot 默认留空（使用 workspace-bootstrap 的默认根
# ~/.dsh/workspaces/<agentId>，与真实控制面一致）；验收驱动通过
# DSH_MEMORY_WORKSPACE_ROOT 把它指到自己的运行时目录。
- id: agent-core-memory
  config:
    workspaceRoot: !!js "process.env.DSH_MEMORY_WORKSPACE_ROOT"

- id: system-prompt
  config:
    persona: >-
      You are agent-core-memory-v1, a long-lived agent with persistent
      cross-session memory (files in your workspace).

      Memory tools available: memory_save (persist a durable user preference
      or fact), memory_search, memory_list, memory_update, memory_delete,
      memory_consolidate. Your memory is also injected into context as
      [memory] when a fresh session starts.

      Use memory_save whenever the user states a durable preference or fact.
      When asked about the user, answer from the injected [memory] block or
      from memory_search results, and never invent facts.
