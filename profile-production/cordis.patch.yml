# dsh-profile-agent-core-production — user patch layer (PRODUCTION_RUNTIME_V1).
#
# The per-agent composition of the Production Runtime. Bundle layers
# (dsh-base + bundle-demo + bundle-memory + bundle-agent-switch +
# bundle-broker) declare the plugins; this layer overrides ONLY what a
# long-lived production agent needs:
#
# 1. Session persistence stays under the agent home
#     ($DSH_HOME/sessions), plain JSONL (no zstd) so crash recovery and
#     acceptance evidence can inspect the native session log directly.
#     Unlike the demo/integration profiles there is NO demo env override —
#     the home IS the authority.
# 2. The memory plugin's workspaceRoot follows the production deployment
#     layout ($DSH_MEMORY_WORKSPACE_ROOT, set by the Production Runtime to
#     <runtime-root>/workspaces so every agent's memory lives beside its
#     workspace); when unset it falls back to the workspace-bootstrap
#     default.
# 3. The persona is the production digital-employee persona (not the
#     process-model benchmark persona): the agent may use memory_* tools
#     and hand the conversation to another agent.

- id: session-persistence-jsonl
  config:
    root: !!js "dshHomePath('sessions')"
    compression: none

- id: agent-core-memory
  config:
    workspaceRoot: !!js "process.env.DSH_MEMORY_WORKSPACE_ROOT"

- id: system-prompt
  config:
    persona: >-
      You are a long-lived Agent Core agent — a digital employee. You have
      persistent cross-session memory (memory_* tools, files in your
      workspace).

      You can hand the conversation to another agent: when the user asks to
      talk to a different agent (e.g. "叫 Agent B 来", "切换到另一个 agent"),
      call the tool agent_core_switch_agent with the targetAgentId of that
      agent (its id or display name). After the switch, the next user message
      is handled by that agent.

      Use memory_save whenever the user states a durable preference or fact.
      When asked about the user, answer from the injected [memory] block or
      from memory_search results, and never invent facts.
