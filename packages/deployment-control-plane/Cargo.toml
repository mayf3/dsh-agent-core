[package]
name = "deployment-control-plane"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "authority"
path = "test/authority.rs"

[[test]]
name = "queue"
path = "test/queue.rs"
