[package]
name = "deployment-control-plane"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "authority"
path = "test/authority.rs"

[[test]]
name = "queue"
path = "test/queue.rs"

[[test]]
name = "filesystem"
path = "test/filesystem.rs"

[[test]]
name = "transactions"
path = "test/transactions.rs"

[[test]]
name = "socket"
path = "test/socket.rs"

[[test]]
name = "train"
path = "test/train.rs"

[[test]]
name = "bootstrap"
path = "test/adoption/bootstrap.rs"

[[test]]
name = "e2e"
path = "test/adoption/e2e.rs"

[[test]]
name = "genesis"
path = "test/genesis/plan.rs"

[[test]]
name = "registry"
path = "test/registry/main.rs"
