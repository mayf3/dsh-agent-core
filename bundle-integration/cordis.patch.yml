# @agent-core/bundle-integration — Integration V1 control-plane patch layer
# over dsh-base.
#
# This composition hosts the Router / Control Plane: the Feishu channel
# (@agent-core/feishu-connector) plus the agent router (@agent-core/agent-router).
# It does NOT host agent sessions — each Agent's session lives in its own
# per-agent DSH process (profile agent-core-demo: demo-server + owner-guard),
# which the router spawns on demand.
#
# Routing follows D-002 (AGENT_SESSION_CHANNEL_MODEL_V1): the router auto-binds
# every ChannelConversation to the default Agent + Session on first contact.
# No static chatId table, no agent switching, no binding history in V1.
# Credentials come from a 0600 JSON file {appId, appSecret} (generated by
# scripts/setup-feishu-creds.mjs, path overridable via FEISHU_CREDS_PATH).

- insert:
    - id: agent-core-workspace-bootstrap
      name: '@agent-core/workspace-bootstrap'

    - id: agent-core-feishu
      name: '@agent-core/feishu-connector'
      config:
        enabled: true
        credentialsPath: !!js "process.env.FEISHU_CREDS_PATH"

    - id: agent-core-router
      name: '@agent-core/agent-router'
      config:
        defaultAgentId: !!js "process.env.ROUTER_DEFAULT_AGENT ?? 'agent-demo'"
        defaultSessionId: !!js "process.env.ROUTER_DEFAULT_SESSION ?? 'main'"
