# @agent-core/bundle-integration — control-plane patch layer over dsh-base.
#
# This composition hosts the Router / Control Plane: the Agent Registry
# (long-lived Agent identity), the workspace bootstrap, the Feishu channel
# (@agent-core/feishu-connector) and the agent router
# (@agent-core/agent-router). It does NOT host agent sessions — each Agent's
# session lives in its own per-agent DSH process (default profile
# agent-core-demo, or agent-core-integration-agent for the Product
# Integration V1 acceptance: demo-server + owner-guard + agent-memory +
# agent-switch), which the router spawns on demand.
#
# Routing follows D-002 (AGENT_SESSION_CHANNEL_MODEL_V1): the router auto-binds
# every ChannelConversation to the default Agent + Session on first contact,
# and exposes ONE domain operation to change a Binding: switchAgent
# (persisted, so the Control Plane restart keeps the same Binding). No static
# chatId table, no per-entry routing, no binding history in V1.
#
# Deployment overrides (env at process start):
#   AGENT_REGISTRY_STORE   registry store path (default ~/.dsh/registry/agents.json)
#   ROUTER_BINDINGS_STORE  binding store path   (default <home>/.dsh/bindings/bindings.json)
#   ROUTER_DEFAULT_AGENT   fallback default agent id when the registry has none
#   ROUTER_DEFAULT_SESSION default session for new bindings (default 'main')
#   ROUTER_AGENT_PROFILE   per-agent process profile (default agent-core-demo)
#   FEISHU_CREDS_PATH      feishu credentials {appId, appSecret} JSON file
#   FEISHU_ENABLED         set to '0' to run the control plane without the channel

- insert:
    - id: agent-core-workspace-bootstrap
      name: '@agent-core/workspace-bootstrap'

    - id: agent-core-registry
      name: '@agent-core/agent-registry'
      config:
        storeFile: !!js "process.env.AGENT_REGISTRY_STORE"

    - id: agent-core-feishu
      name: '@agent-core/feishu-connector'
      config:
        enabled: !!js "process.env.FEISHU_ENABLED !== '0'"
        credentialsPath: !!js "process.env.FEISHU_CREDS_PATH"

    - id: agent-core-router
      name: '@agent-core/agent-router'
      config:
        defaultAgentId: !!js "process.env.ROUTER_DEFAULT_AGENT ?? 'agent-demo'"
        defaultSessionId: !!js "process.env.ROUTER_DEFAULT_SESSION ?? 'main'"
        agentProfile: !!js "process.env.ROUTER_AGENT_PROFILE ?? 'agent-core-demo'"
        bindingsStoreFile: !!js "process.env.ROUTER_BINDINGS_STORE"

    # Trusted Broker boundary (gateway mode): the in-process credential
    # boundary of the trusted control plane (deployment uid authsvc/505).
    # Reached ONLY through the Router's parent-RPC dispatch, which decides
    # the caller from the ACTUAL proc.agentId; the MachineClient credential
    # is read from the 505-private store (AGENT_CORE_CREDENTIALS_FILE).
    # Env:
    #   AGENT_CORE_CREDENTIALS_FILE   ABSOLUTE path of the 505-private store
    #   BROKER_AUTH_ORIGIN            auth-service origin (default 127.0.0.1:4001)
    - id: agent-core-broker-gateway
      name: '@agent-core/broker'
      config:
        mode: 'gateway'
        credentialsFile: !!js "process.env.AGENT_CORE_CREDENTIALS_FILE"
        authServiceOrigin: !!js "process.env.BROKER_AUTH_ORIGIN ?? 'http://127.0.0.1:4001'"

    # Gate 1: thin Mobile Product API over the Router (localhost only, for
    # the Android Emulator -> adb reverse -> localhost slice). Env:
    #   PRODUCT_API_ENABLED  set to '0' to mount without the HTTP server
    #   PRODUCT_API_HOST     bind host (default 127.0.0.1 — no LAN exposure)
    #   PRODUCT_API_PORT     bind port (default 8787; adb reverse tcp:8787)
    - id: agent-core-product-api
      name: '@agent-core/product-api'
      config:
        enabled: !!js "process.env.PRODUCT_API_ENABLED !== '0'"
        host: !!js "process.env.PRODUCT_API_HOST ?? '127.0.0.1'"
        port: !!js "Number.parseInt(process.env.PRODUCT_API_PORT ?? '8787', 10)"

    # Notification Ingress V0: thin POST /v1/deliver adapter over the FROZEN
    # Router contract agentRouter.deliver(...) (localhost only, same posture
    # as product-api). While the Router branch implementing deliver() is not
    # merged, the mount answers /v1/deliver with 503 SERVICE_UNAVAILABLE and
    # logs the pending dependency — it never re-implements Router logic.
    # Env:
    #   NOTIFICATION_INGRESS_ENABLED  set to '0' to mount without the HTTP server
    #   NOTIFICATION_INGRESS_HOST     bind host (default 127.0.0.1 — no LAN exposure)
    #   NOTIFICATION_INGRESS_PORT     bind port (default 8790)
    - id: agent-core-notification-ingress
      name: '@agent-core/notification-ingress'
      config:
        enabled: !!js "process.env.NOTIFICATION_INGRESS_ENABLED !== '0'"
        host: !!js "process.env.NOTIFICATION_INGRESS_HOST ?? '127.0.0.1'"
        port: !!js "Number.parseInt(process.env.NOTIFICATION_INGRESS_PORT ?? '8790', 10)"
