# @agent-core/bundle-broker — per-agent capability broker patch layer over
# dsh-base (mounted inside a per-agent profile, after bundle-demo).
#
# The broker belongs in the per-agent composition: its credential seam
# (packages/broker/src/credential.js) reads the per-process credential that
# the Router injects at spawn (AGENT_CORE_BROKER_CLIENT_ID / _SECRET) and
# exchanges it at auth-service client_credentials — so every HTTP capability
# (Forum / Workflow / OKR) executes with THIS agent's own identity. No
# credential is ever provided through model input or tool arguments; without
# an injected credential every HTTP capability fails closed
# (credential_unavailable).

- insert:
    - id: agent-core-broker
      name: '@agent-core/broker'
