name: PR140 Governance Adoption Evidence

on:
  push:
    branches:
      - audit/pr140-adoption-v1-execution

permissions:
  contents: read

jobs:
  verify-adoption:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact upstream release source
        uses: actions/checkout@v4
        with:
          repository: mayf3/agent-development-governance
          ref: 902842735a69797b54016eeaa88d2f949f5879a9
          path: upstream
          fetch-depth: 1

      - name: Execute exact vendor dry-run and candidate validators
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT="$RUNNER_TEMP/pr140-adoption-execution-receipt.txt"
          exec > >(tee "$RECEIPT") 2>&1

          echo "TASK_NAME=修订 执行"
          echo "EVIDENCE_KIND=INDEPENDENT_CI_EXECUTION_SURFACE"
          echo "CONSUMER_REPOSITORY=mayf3/dsh-agent-core"
          echo "CONSUMER_CHECKOUT_HEAD=$(git rev-parse HEAD)"
          echo "UPSTREAM_CHECKOUT_HEAD=$(git -C upstream rev-parse HEAD)"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "PYTHON_VERSION=$(python3 --version 2>&1)"
          echo "EXECUTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          test "$(git rev-parse HEAD)" = "669d6f40bcfe37d0e299f5b1bea3957d0f5ca785"
          test "$(git -C upstream rev-parse HEAD)" = "902842735a69797b54016eeaa88d2f949f5879a9"
          test -z "$(git -C upstream status --porcelain=v1 --untracked-files=all)"

          echo "--- VENDOR_DRY_RUN_BEGIN ---"
          python3 upstream/tools/vendor.py \
            --target . \
            --source-commit 902842735a69797b54016eeaa88d2f949f5879a9 \
            --prepared-by "PR140 execution evidence" \
            --prepared-at "2026-09-02T21:15:00Z" \
            --adoption-status proposed \
            | tee "$RUNNER_TEMP/vendor-dry-run.txt"
          grep -F "DRY-RUN: 26 file operations" "$RUNNER_TEMP/vendor-dry-run.txt"
          grep -F "No files written." "$RUNNER_TEMP/vendor-dry-run.txt"
          test -z "$(git status --porcelain=v1 --untracked-files=all -- .agents AGENTS.md docs/specs/README.md)"
          echo "VENDOR_DRY_RUN_EXIT=0"
          echo "VENDOR_DRY_RUN_WRITE_DELTA=NONE"
          echo "--- VENDOR_DRY_RUN_END ---"

          echo "--- GOVERNANCE_VERIFIER_BEGIN ---"
          python3 .agents/tools/verify_governance.py --target .
          echo "GOVERNANCE_VERIFIER_EXIT=0"
          echo "--- GOVERNANCE_VERIFIER_END ---"

          python3 -m py_compile \
            .agents/tools/verify_governance.py \
            .agents/tools/validate_spec_transition.py \
            .agents/tools/validate_governance_route.py
          echo "PY_COMPILE_EXIT=0"

          cat > "$RUNNER_TEMP/valid-route.json" <<'JSON'
          {
            "schema_version": 1,
            "task_id": "PR140-GOVERNANCE-V1-ADOPTION-PREPARATION",
            "goal": "Prepare exact Governance v1.0.0 bytes for independent local adoption review",
            "current_gap": "Governance V1 is proposed and not yet accepted in the consumer repository",
            "done_when": "Exact bytes, proposed lifecycle, and executed validation evidence are ready for independent review",
            "route_stage": "AUTHORITY_AUTHORING",
            "authority_accepted_in_base": "NO",
            "owner_decision_required": false,
            "authority": {
              "declared_action": "SUPERSEDE",
              "ownership_known": true,
              "accepted_owner_exists": true,
              "accepted_meaning_changed": true,
              "accepted_strict_addition": false,
              "proposed_target_named": false,
              "proposal_scope_changed": false,
              "proposal_ownership_changed": false,
              "proposal_decision_identity_changed": false,
              "implementation_authority": "none",
              "atomic_spec_implementation_permitted": false
            },
            "plan": {"complexity": "COMPLEX", "level": "EXEC_PLAN"},
            "assurance": {
              "failure_consequence": "DURABLE_STATE",
              "level": "DURABLE",
              "controlled_runbook_present": false
            },
            "execution_mandate": {
              "status": "NOT_APPLICABLE",
              "attributable": false,
              "target_bound": false,
              "actor_bound": false,
              "environment_bound": false,
              "scope_bound": false,
              "allowed_effects_bound": false,
              "forbidden_effects_bound": false,
              "exact_operation_bound": false,
              "done_when_bound": false,
              "abort_conditions_bound": false,
              "secret_handling_bound": false,
              "receipt_bound": false,
              "attempt_bounds_bound": false,
              "self_issued": false
            },
            "write_surface": {"mutation_planned": false, "isolated": true},
            "spec_gap_dependency": "NONE",
            "evidence": {
              "load_bearing_required": true,
              "reviewability": "PASS",
              "fabrication_observed": false,
              "failure_class": "NONE"
            },
            "live_authority_gap": {
              "state": "NONE",
              "expansion_frozen": false,
              "auto_delete": false,
              "permanent_grandfather": false,
              "owner_disposition_present": false
            },
            "emergency": {
              "state": "NONE",
              "action_kind": "NONE",
              "owner_authorized": false,
              "incident_reference_present": false,
              "durable_new_behavior": false,
              "normal_authority_reconciliation_required": false
            },
            "review": {
              "review_target_head": "669d6f40bcfe37d0e299f5b1bea3957d0f5ca785",
              "base_head": "840d2f4ad91f8252eb1f163330c041216a0dd9c4",
              "current_base_head": "205d9f748347542eb0fc88d5689d719849d85b97",
              "target_head_changed": false,
              "relevant_base_impact": false,
              "full_rereview_required": false
            },
            "readiness": {
              "implementation_allowed": "NO",
              "merge_ready": "NO",
              "operation_allowed": "NO"
            },
            "stop": {
              "done_when_met": false,
              "expansion_triggered": false,
              "next_action": "CONTINUE"
            },
            "findings": []
          }
          JSON

          cp "$RUNNER_TEMP/valid-route.json" "$RUNNER_TEMP/contradictory-route.json"
          python3 - "$RUNNER_TEMP/contradictory-route.json" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text())
          data["readiness"]["implementation_allowed"] = "YES"
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          printf '{' > "$RUNNER_TEMP/malformed-route.json"

          echo "--- ROUTE_VALIDATOR_BEGIN ---"
          python3 .agents/tools/validate_governance_route.py "$RUNNER_TEMP/valid-route.json"
          valid_rc=$?
          set +e
          python3 .agents/tools/validate_governance_route.py "$RUNNER_TEMP/contradictory-route.json"
          contradictory_rc=$?
          python3 .agents/tools/validate_governance_route.py "$RUNNER_TEMP/malformed-route.json"
          malformed_rc=$?
          set -e
          echo "ROUTE_VALIDATOR_VALID_EXIT=$valid_rc"
          echo "ROUTE_VALIDATOR_CONTRADICTORY_EXIT=$contradictory_rc"
          echo "ROUTE_VALIDATOR_MALFORMED_EXIT=$malformed_rc"
          test "$valid_rc" -eq 0
          test "$contradictory_rc" -eq 1
          test "$malformed_rc" -eq 2
          echo "--- ROUTE_VALIDATOR_END ---"

          echo "FINAL_STATUS=PASS"

      - name: Upload execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr140-adoption-execution-receipt
          path: |
            ${{ runner.temp }}/pr140-adoption-execution-receipt.txt
            ${{ runner.temp }}/vendor-dry-run.txt
            ${{ runner.temp }}/valid-route.json
            ${{ runner.temp }}/contradictory-route.json
            ${{ runner.temp }}/malformed-route.json
          if-no-files-found: error
          retention-days: 30
